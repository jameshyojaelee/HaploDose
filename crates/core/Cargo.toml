[package]
name = "haplodose-core"
version = "0.1.0"
edition = "2021"
description = "Streaming sparse aggregation kernels for Haplodose"
license = "MIT"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.30"
numpy = "0.30"
rayon = "1.12"

[features]
# Enabled by maturin; plain `cargo test` links libpython instead.
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
